[package]
name = "tenuo-rig-mcp-delegation"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rig manager-worker agents calling MCP tools under Tenuo warrants"

[dependencies]
anyhow = "1"
serde_json = "1"
tenuo = { path = "../../tenuo-core", default-features = false, features = ["sdk", "mcp-transport"] }
tokio = { version = "1", features = ["full"] }

# Rig 0.42 + the same rmcp 2.x line Rig itself depends on.
rig-agent = { version = "0.42", features = ["test-utils", "rmcp"] }
rmcp = { version = "2", features = ["server", "client", "macros", "transport-async-rw"] }
