<svg width="100%" viewBox="0 0 680 490" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Request authority through a workflow-backed Temporal Nexus operation</title>
  <desc>An agent or workflow calls a Nexus endpoint. Temporal checks namespace reachability, the Nexus handler verifies the request warrant, a destination workflow receives narrowed authority, and an activity worker verifies the activity before worker IAM permits access to infrastructure.</desc>
  <style>
    .panel{fill:#0b1220;stroke:#1e293b}.card{fill:#111a2b;stroke:#334155;stroke-width:1.2}.temporal{fill:#171933;stroke:#818cf8;stroke-width:1.4}.tenuo-check{fill:#0f2a3a;stroke:#38bdf8;stroke-width:1.2}.iam{fill:#0f291f;stroke:#34d399;stroke-width:1.4}
    .title{fill:#f8fafc;font:600 15px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.subtitle{fill:#94a3b8;font:400 10.5px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.eyebrow{fill:#94a3b8;font:700 9.5px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:.7px}.nexus-text{fill:#a5b4fc}.tenuo-text{fill:#7dd3fc}.iam-text{fill:#6ee7b7}.label{fill:#e2e8f0;font:500 11.5px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.small{fill:#94a3b8;font:400 10px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{fill:#e2e8f0;font:500 10px 'SFMono-Regular',Consolas,'Liberation Mono',monospace}.wire{fill:#94a3b8;font:500 9px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect x="10" y="10" width="660" height="470" rx="16" class="panel"/>

  <!-- Request source -->
  <rect x="28" y="28" width="184" height="180" rx="12" class="card"/>
  <text x="46" y="53" class="eyebrow">REQUEST SOURCE</text>
  <text x="46" y="80" class="title">Workflow or agent</text>
  <text x="46" y="99" class="subtitle">Product Team A namespace</text>
  <line x1="46" y1="115" x2="194" y2="115" stroke="#334155"/>
  <text x="46" y="138" class="small">Operation</text>
  <text x="46" y="156" class="mono">scale_cluster_pool</text>
  <text x="46" y="181" class="mono">cluster-gpu-dev-a · max 5</text>

  <!-- Nexus endpoint -->
  <rect x="247" y="28" width="174" height="180" rx="12" class="temporal"/>
  <text x="265" y="53" class="eyebrow nexus-text">01 / REACHABILITY</text>
  <text x="265" y="80" class="title">Nexus allowlist</text>
  <text x="265" y="99" class="subtitle">Temporal Cloud broker</text>
  <line x1="265" y1="115" x2="403" y2="115" stroke="#312e81"/>
  <text x="265" y="143" class="label">May this namespace</text>
  <text x="265" y="162" class="label">reach the endpoint?</text>
  <rect x="265" y="174" width="88" height="23" rx="11.5" fill="#24264d" stroke="#818cf8" stroke-opacity=".6"/>
  <circle cx="280" cy="185.5" r="4" fill="#818cf8"/>
  <text x="291" y="189" class="small" style="fill:#c7d2fe">Admitted</text>

  <!-- Nexus handler -->
  <rect x="456" y="28" width="196" height="180" rx="12" class="temporal"/>
  <text x="474" y="53" class="eyebrow nexus-text">02 / NEXUS HANDLER</text>
  <text x="474" y="80" class="title">Nexus handler worker</text>
  <text x="474" y="99" class="subtitle">Destination namespace</text>
  <rect x="474" y="113" width="160" height="58" rx="8" class="tenuo-check"/>
  <text x="486" y="133" class="eyebrow tenuo-text">TENUO CHECK</text>
  <text x="486" y="151" class="small">operation · arguments</text>
  <text x="486" y="165" class="small">holder · delegation chain</text>
  <text x="474" y="192" class="small">Start destination workflow if allowed</text>

  <line x1="212" y1="118" x2="239" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="107" text-anchor="middle" class="wire">call</text>
  <line x1="421" y1="118" x2="448" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="434" y="107" text-anchor="middle" class="wire">route</text>

  <!-- Destination workflow -->
  <line x1="554" y1="208" x2="554" y2="235" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#blue-arrow)"/>
  <text x="566" y="226" class="wire">narrow / issue</text>
  <rect x="456" y="240" width="196" height="82" rx="12" class="temporal"/>
  <text x="474" y="263" class="eyebrow nexus-text">03 / AUTHORITY HANDOFF</text>
  <text x="474" y="286" class="title">Destination workflow</text>
  <text x="474" y="304" class="subtitle">Receives task-bound authority</text>

  <!-- Activity execution -->
  <line x1="554" y1="322" x2="554" y2="349" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#blue-arrow)"/>
  <text x="566" y="340" class="wire">schedule activity</text>
  <rect x="456" y="354" width="196" height="98" rx="12" class="temporal"/>
  <text x="474" y="377" class="eyebrow nexus-text">04 / ACTIVITY WORKER</text>
  <text x="474" y="400" class="title">Activity worker</text>
  <rect x="474" y="408" width="160" height="36" rx="7" class="tenuo-check"/>
  <text x="484" y="422" class="eyebrow tenuo-text">TENUO CHECK</text>
  <text x="484" y="438" class="small">activity + arguments</text>

  <!-- Infrastructure access -->
  <line x1="456" y1="403" x2="388" y2="403" stroke="#34d399" stroke-width="1.5" marker-end="url(#green-arrow)"/>
  <text x="422" y="392" text-anchor="middle" class="wire">credentials</text>
  <rect x="160" y="354" width="220" height="98" rx="12" class="iam"/>
  <text x="178" y="377" class="eyebrow iam-text">05 / INFRASTRUCTURE ACCESS</text>
  <text x="178" y="400" class="title">Worker IAM</text>
  <text x="178" y="420" class="subtitle">AWS · databases</text>
  <text x="178" y="438" class="subtitle">internal services</text>
</svg>
