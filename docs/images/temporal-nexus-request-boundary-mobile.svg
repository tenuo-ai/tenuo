<svg width="100%" viewBox="0 0 360 845" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Request authority through a workflow-backed Temporal Nexus operation</title>
  <desc>An agent or workflow calls a Nexus endpoint. Temporal checks namespace reachability, the Nexus handler verifies the request warrant, a destination workflow receives narrowed authority, and an activity worker verifies the activity before worker IAM permits infrastructure access.</desc>
  <style>
    .panel{fill:#0b1220;stroke:#1e293b}.card{fill:#111a2b;stroke:#334155;stroke-width:1.2}.temporal{fill:#171933;stroke:#818cf8;stroke-width:1.4}.tenuo-check{fill:#0f2a3a;stroke:#38bdf8;stroke-width:1.2}.iam{fill:#0f291f;stroke:#34d399;stroke-width:1.4}
    .title{fill:#f8fafc;font:600 14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.subtitle{fill:#94a3b8;font:400 10.5px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.eyebrow{fill:#94a3b8;font:700 9px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:.6px}.nexus-text{fill:#a5b4fc}.tenuo-text{fill:#7dd3fc}.iam-text{fill:#6ee7b7}.label{fill:#e2e8f0;font:500 11px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.small{fill:#94a3b8;font:400 9.5px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{fill:#e2e8f0;font:500 9.5px 'SFMono-Regular',Consolas,'Liberation Mono',monospace}
  </style>
  <defs>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="blue-arrow-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="green-arrow-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="8" y="8" width="344" height="829" rx="15" class="panel"/>

  <rect x="25" y="25" width="310" height="112" rx="11" class="card"/>
  <text x="43" y="48" class="eyebrow">REQUEST SOURCE</text>
  <text x="43" y="73" class="title">Workflow or agent</text>
  <text x="43" y="91" class="subtitle">Product Team A namespace</text>
  <line x1="181" y1="43" x2="181" y2="119" stroke="#334155"/>
  <text x="199" y="58" class="small">Operation</text>
  <text x="199" y="75" class="mono">scale_cluster_pool</text>
  <text x="199" y="99" class="mono">cluster-gpu-dev-a</text>
  <text x="199" y="116" class="mono">max_nodes: 5</text>
  <line x1="180" y1="137" x2="180" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-m)"/>

  <rect x="25" y="165" width="310" height="105" rx="11" class="temporal"/>
  <text x="43" y="188" class="eyebrow nexus-text">01 / REACHABILITY</text>
  <text x="43" y="213" class="title">Nexus allowlist</text>
  <text x="43" y="232" class="subtitle">May this namespace reach the endpoint?</text>
  <rect x="228" y="196" width="84" height="25" rx="12.5" fill="#24264d" stroke="#818cf8" stroke-opacity=".6"/>
  <circle cx="243" cy="208.5" r="4" fill="#818cf8"/>
  <text x="254" y="212" class="small" style="fill:#c7d2fe">Admitted</text>
  <line x1="180" y1="270" x2="180" y2="293" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-m)"/>

  <rect x="25" y="298" width="310" height="142" rx="11" class="temporal"/>
  <text x="43" y="321" class="eyebrow nexus-text">02 / NEXUS HANDLER</text>
  <text x="43" y="346" class="title">Nexus handler worker</text>
  <text x="43" y="365" class="subtitle">Destination namespace</text>
  <rect x="43" y="377" width="274" height="40" rx="7" class="tenuo-check"/>
  <text x="55" y="393" class="eyebrow tenuo-text">TENUO CHECK</text>
  <text x="55" y="408" class="small">operation · arguments · holder · delegation chain</text>
  <text x="43" y="431" class="small">If allowed, start destination workflow</text>
  <line x1="180" y1="440" x2="180" y2="463" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#blue-arrow-m)"/>

  <rect x="25" y="468" width="310" height="82" rx="11" class="temporal"/>
  <text x="43" y="491" class="eyebrow nexus-text">03 / AUTHORITY HANDOFF</text>
  <text x="43" y="516" class="title">Destination workflow</text>
  <text x="43" y="535" class="subtitle">Receives task-bound authority</text>
  <line x1="180" y1="550" x2="180" y2="573" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#blue-arrow-m)"/>

  <rect x="25" y="578" width="310" height="112" rx="11" class="temporal"/>
  <text x="43" y="601" class="eyebrow nexus-text">04 / ACTIVITY WORKER</text>
  <text x="43" y="626" class="title">Activity worker</text>
  <rect x="43" y="638" width="274" height="30" rx="7" class="tenuo-check"/>
  <text x="55" y="657" class="eyebrow tenuo-text">TENUO CHECK</text>
  <text x="150" y="657" class="small">activity + arguments</text>
  <text x="43" y="682" class="small">Then run activity code</text>
  <line x1="180" y1="690" x2="180" y2="713" stroke="#34d399" stroke-width="1.5" marker-end="url(#green-arrow-m)"/>

  <rect x="25" y="718" width="310" height="92" rx="11" class="iam"/>
  <text x="43" y="741" class="eyebrow iam-text">05 / INFRASTRUCTURE ACCESS</text>
  <text x="43" y="766" class="title">Worker IAM</text>
  <text x="43" y="785" class="subtitle">AWS · databases · internal services</text>
</svg>
