<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img">
  <title>From repository evidence to bounded action</title>
  <desc>Jev decides, LangGraph coordinates, and Tenuo authorizes before an agent action is executed.</desc>

  <rect width="1400" height="680" rx="28" fill="#0b0f14"/>

  <text x="700" y="86" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="700" fill="#f8fafc">From evidence to bounded action</text>
  <text x="700" y="124" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#94a3b8">Judgment, control flow, and authority stay separate</text>

  <line x1="162" y1="354" x2="1238" y2="354" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <circle cx="128" cy="354" r="50" fill="#111820" stroke="#64748b" stroke-width="2"/>
  <path d="M112 329h24l12 12v38h-36z" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round"/>
  <path d="M136 329v13h12" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round"/>
  <line x1="120" y1="352" x2="140" y2="352" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="362" x2="138" y2="362" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <text x="128" y="438" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#94a3b8">EVIDENCE</text>

  <rect x="238" y="224" width="260" height="260" rx="26" fill="#181726" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="368" cy="288" r="28" fill="#2a2541"/>
  <text x="368" y="298" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#ddd6fe">J</text>
  <text x="368" y="357" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#c4b5fd">DECIDE</text>
  <text x="368" y="401" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="650" fill="#f8fafc">Jev</text>
  <text x="368" y="435" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#94a3b8">typed choice</text>

  <rect x="570" y="224" width="260" height="260" rx="26" fill="#111d2a" stroke="#7fc8ff" stroke-width="2"/>
  <circle cx="700" cy="288" r="28" fill="#172a3d"/>
  <text x="700" y="298" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#bae0ff">L</text>
  <text x="700" y="357" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#bae0ff">COORDINATE</text>
  <text x="700" y="401" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="650" fill="#f8fafc">LangGraph</text>
  <text x="700" y="435" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#94a3b8">workflow state</text>

  <rect x="902" y="224" width="260" height="260" rx="26" fill="#102027" stroke="#22c7df" stroke-width="2"/>
  <circle cx="1032" cy="288" r="28" fill="#12303a"/>
  <text x="1032" y="298" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#a5f3fc">t</text>
  <text x="1032" y="357" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#67e8f9">AUTHORIZE</text>
  <text x="1032" y="401" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="650" fill="#f8fafc">tenuo</text>
  <text x="1032" y="435" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#94a3b8">scoped warrant</text>

  <circle cx="1272" cy="354" r="50" fill="#102027" stroke="#22c7df" stroke-width="2"/>
  <path d="M1249 355l15 15 30-34" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1272" y="438" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#67e8f9">ACTION</text>

  <path d="M213 354 L197 344 L197 364 Z" fill="#64748b"/>
  <path d="M545 354 L529 344 L529 364 Z" fill="#a78bfa"/>
  <path d="M877 354 L861 344 L861 364 Z" fill="#7fc8ff"/>
  <path d="M1213 354 L1197 344 L1197 364 Z" fill="#22c7df"/>

  <rect x="448" y="550" width="504" height="54" rx="27" fill="#111820" stroke="#334155" stroke-width="1.5"/>
  <text x="700" y="584" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#cbd5e1">recommendation ≠ permission</text>
</svg>
