<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
     aria-label="A boarding pass from Toronto to Cancun for Alice Chen, stamped DENIED, outside granted scope." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AI Agent Delegation Security Challenge</title>
  <desc>A boarding pass from Toronto to Cancun for Alice Chen with a red DENIED stamp reading outside granted scope.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#040a0f"/><stop offset="45%" stop-color="#071722"/>
      <stop offset="100%" stop-color="#0e3a52"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#075985"/><stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <style>
      .kick{font-family:'Carlito',Arial,sans-serif;font-size:19px;font-weight:700;letter-spacing:.22em;fill:#7dd3fc}
      .head{font-family:'Bitstream Charter',Georgia,serif;font-size:66px;font-weight:700;fill:#fff;letter-spacing:-.02em}
      .sub{font-family:'Carlito',Arial,sans-serif;font-size:25px;fill:#c8d8e4}
      .url{font-family:'Carlito',Arial,sans-serif;font-size:22px;font-weight:700;fill:#fff}
      .meta{font-family:'Carlito',Arial,sans-serif;font-size:19px;fill:#7dd3fc}
      .pl{font-family:'Carlito',Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;fill:#8b9298}
      .pv{font-family:'Carlito',Arial,sans-serif;font-size:20px;font-weight:700;fill:#1d2529}
      .pc{font-family:'Bitstream Charter',Georgia,serif;font-size:48px;font-weight:700;fill:#12333a}
      .pb{font-family:'Carlito',Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:.20em;fill:#eaf7f5}
      .pb2{font-family:'Carlito',Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:.18em;fill:#bae6fd}
      .st{font-family:'Liberation Mono',monospace;font-size:41px;font-weight:700;letter-spacing:.13em;fill:#c33a2c}
      .st2{font-family:'Liberation Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.14em;fill:#c33a2c}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="640" cy="250" r="360" fill="url(#sun)"/>
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5">
    <rect x="222" y="112" width="756" height="412" rx="22" transform="rotate(-5 600 318)"/>
    <rect x="182" y="82"  width="836" height="472" rx="26" transform="rotate(-5 600 318)"/>
  </g>

  <g transform="translate(600,318) rotate(-5) scale(1.08) translate(-310,-155)">
    <rect x="7" y="11" width="620" height="310" rx="16" fill="#02070b" opacity="0.38"/>
    <rect x="0" y="0" width="620" height="310" rx="16" fill="#fdfaf4"/>
    <path d="M440 58 H620 V294 a16 16 0 0 1 -16 16 H440 Z" fill="#f3ede0"/>
    <path d="M0 16 a16 16 0 0 1 16 -16 H604 a16 16 0 0 1 16 16 V58 H0 Z" fill="url(#bar)"/>

    <text class="pb"  x="26"  y="37">TENUO AIR</text>
    <text class="pb2" x="474" y="36">BOARDING PASS</text>

    <text class="pl" x="26" y="96">PASSENGER</text>
    <text class="pv" x="26" y="122">ALICE CHEN</text>

    <text class="pl" x="26"  y="164">FROM</text>
    <text class="pc" x="24"  y="210">YYZ</text>
    <text class="pl" x="226" y="164">TO</text>
    <text class="pc" x="224" y="210">CUN</text>
    <g transform="translate(154,192)" fill="#0ea5e9">
      <path d="M0 -7 L26 -7 L40 0 L26 7 L0 7 L8 0 Z"/>
    </g>

    <text class="pl" x="26"  y="246">FLIGHT</text>
    <text class="pv" x="26"  y="272">UA214</text>
    <text class="pl" x="176" y="246">DEPARTS</text>
    <text class="pv" x="176" y="272">FRI 18:40</text>

    <line x1="440" y1="72" x2="440" y2="296" stroke="#cfc6b4" stroke-width="2" stroke-dasharray="6 7"/>

    <text class="pl" x="466" y="96">SEAT</text>
    <text class="pv" x="466" y="122">12A</text>
    <text class="pl" x="548" y="96">GATE</text>
    <text class="pv" x="548" y="122">7</text>
    <g fill="#2a3438">
      <rect x="466" y="154" width="3" height="52"/><rect x="473" y="154" width="6" height="52"/>
      <rect x="483" y="154" width="2" height="52"/><rect x="489" y="154" width="7" height="52"/>
      <rect x="500" y="154" width="3" height="52"/><rect x="507" y="154" width="2" height="52"/>
      <rect x="513" y="154" width="6" height="52"/><rect x="523" y="154" width="3" height="52"/>
      <rect x="530" y="154" width="7" height="52"/><rect x="541" y="154" width="2" height="52"/>
      <rect x="547" y="154" width="5" height="52"/><rect x="556" y="154" width="3" height="52"/>
      <rect x="563" y="154" width="6" height="52"/><rect x="573" y="154" width="2" height="52"/>
    </g>
    <text class="pl" x="466" y="230">UA214 · YYZ CUN</text>

    <g transform="translate(218,278) rotate(-9)" opacity="0.93">
      <rect x="-150" y="-43" width="300" height="86" rx="9"
            fill="#c33a2c" fill-opacity="0.09" stroke="#c33a2c" stroke-width="4"/>
      <rect x="-141" y="-34" width="282" height="68" rx="5"
            fill="none" stroke="#c33a2c" stroke-width="1.5" stroke-opacity="0.55"/>
      <text class="st"  x="0" y="3"  text-anchor="middle">DENIED</text>
      <text class="st2" x="0" y="25" text-anchor="middle">OUTSIDE GRANTED SCOPE</text>
    </g>
  </g>
  <text x="72" y="566" font-family="Carlito,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing=".24em" fill="#7dd3fc" fill-opacity="0.8">TENUO</text>
</svg>
