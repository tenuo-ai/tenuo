title: Tenuo
description: Task-scoped authorization for AI agents. Signed warrants limit which tools an agent can call, with which arguments, and for how long.
url: "https://tenuo.ai"
baseurl: ""

# Newsletter signup destination.
buttondown_username: "tenuo-engineering"

# Markdown pages get full site chrome (nav, typography). Without this, Jekyll
# emits HTML fragments only — fine for embedding, wrong for published pages.
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Build settings
markdown: kramdown
highlighter: rouge

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .jekyll-cache
