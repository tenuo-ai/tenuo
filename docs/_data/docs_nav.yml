# Docs navigation for tenuo.ai.
#
# The website renders this file as the docs sidebar and as the Previous / Next
# links at the foot of each page. Order is reading order: a newcomer who clicks
# Next from the top should meet ideas in the order they need them.
#
# A page appears in the sidebar only if it is listed here. Pages that are not
# listed keep the plain layout.
#
# url: the path on tenuo.ai. Write it the way the page is served: "/quickstart/"
# for pages with a trailing-slash permalink, "/openai" for flat pages. The site
# ignores a trailing ".html" or "/" when matching, so either form works.
#
# Some URLs point at pages the website repo owns (/concepts, /lab/). That is
# intended: this file orders the whole docs journey, wherever a page lives.

- title: Get started
  pages:
    - title: Docs home
      url: /docs/
    - title: Why Tenuo
      url: /concepts
    - title: Quickstart
      url: /quickstart/
