# Tenuo + Envoy Quickstart (All-in-One)
#
# Envoy HTTP ext_authz -> Tenuo authorizer -> httpbin, in namespace tenuo-system.
# The authorizer speaks Envoy's HTTP ext_authz protocol; gRPC ext_authz is not
# supported yet.
#
# The demo root public key is NOT in this file. Generate it yourself and
# create the tenuo-demo-root ConfigMap (see README.md); the authorizer pod
# waits for it:
#
#   uv run demo_warrant.py init
#   kubectl apply -f all-in-one.yaml
#   kubectl -n tenuo-system create configmap tenuo-demo-root \
#     --from-literal=TENUO_TRUSTED_KEYS="$(uv run demo_warrant.py root-pubkey)"
#
# Delete with: kubectl delete -f all-in-one.yaml
#
# The embedded gateway.yaml and envoy.yaml are copies of the files next to this
# one (CI checks they stay identical).

---
apiVersion: v1
kind: Namespace
metadata:
  name: tenuo-system

---
# Tenuo gateway config (copy of gateway.yaml)
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenuo-config
  namespace: tenuo-system
data:
  gateway.yaml: |
    # Tenuo gateway config for the Envoy quickstart (HTTP ext_authz).
    #
    # Envoy's ext_authz filter is configured with `path_prefix: /ext_authz`, so the
    # authorizer sees every original request path as `/ext_authz/<original path>`.
    # Route patterns below therefore start with /ext_authz. The prefix also keeps
    # client requests away from the authorizer's own /health, /healthz, /ready and
    # /status endpoints, which answer 200 without a warrant and would otherwise
    # let those paths through Envoy unauthenticated.
    #
    # Trusted roots come from TENUO_TRUSTED_KEYS (see README), so no key is
    # hardcoded here.
    version: "1"
    settings:
      warrant_header: "X-Tenuo-Warrant"
      pop_header: "X-Tenuo-PoP"
      clock_tolerance_secs: 30
      # Demo only: adds x-tenuo-deny-reason to denials. Turn off in production.
      debug_mode: true
      trusted_roots: []

    tools:
      httpbin_read:
        description: "GET a top-level httpbin endpoint"
        constraints:
          endpoint:
            from: path
            path: endpoint
            required: true
      httpbin_write:
        description: "POST a JSON message to httpbin /post"
        constraints:
          message:
            from: body
            path: message
            required: true

    routes:
      # GET /<endpoint>  ->  httpbin_read(endpoint=<endpoint>)
      - pattern: "/ext_authz/{endpoint}"
        method: ["GET"]
        tool: httpbin_read
      # POST /post with {"message": "..."}  ->  httpbin_write(message=...)
      - pattern: "/ext_authz/post"
        method: ["POST"]
        tool: httpbin_write
      # Anything else has no route: the authorizer answers 404 and Envoy denies.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenuo-authorizer
  namespace: tenuo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenuo-authorizer
  template:
    metadata:
      labels:
        app: tenuo-authorizer
    spec:
      containers:
      - name: authorizer
        image: tenuo/authorizer:0.3.1
        args: ["serve", "--port", "9090", "--config", "/etc/tenuo/gateway.yaml"]
        ports:
        - containerPort: 9090
        env:
        - name: RUST_LOG
          value: "info"
        # Demo root public key (hex), created by you. See README.md.
        - name: TENUO_TRUSTED_KEYS
          valueFrom:
            configMapKeyRef:
              name: tenuo-demo-root
              key: TENUO_TRUSTED_KEYS
        readinessProbe:
          httpGet:
            path: /ready
            port: 9090
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/tenuo
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: config
        configMap:
          name: tenuo-config

---
apiVersion: v1
kind: Service
metadata:
  name: tenuo-authorizer
  namespace: tenuo-system
spec:
  ports:
  - port: 9090
    targetPort: 9090
  selector:
    app: tenuo-authorizer

---
# Envoy config (copy of envoy.yaml). Short service names resolve inside
# tenuo-system, so the same file works in docker compose and here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: tenuo-system
data:
  envoy.yaml: |
    # Envoy config for the Tenuo quickstart: HTTP ext_authz in front of httpbin.
    #
    # The Tenuo authorizer speaks Envoy's HTTP ext_authz protocol (a plain HTTP
    # check request per client request). gRPC ext_authz is not supported yet, so
    # do not use `grpc_service` here.
    static_resources:
      listeners:
      - name: main
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8080
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              codec_type: AUTO
              # Authorize the same path the backend will see.
              normalize_path: true
              merge_slashes: true
              route_config:
                name: local_route
                virtual_hosts:
                - name: backend
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: httpbin
              http_filters:
              - name: envoy.filters.http.ext_authz
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                  transport_api_version: V3
                  # Fail closed: if the authorizer is down or times out, deny.
                  failure_mode_allow: false
                  # Forward the JSON body so `from: body` extraction works.
                  with_request_body:
                    max_request_bytes: 65536
                    allow_partial_message: false
                  # Request headers copied into the check request (method, path,
                  # host and content-length are always sent).
                  allowed_headers:
                    patterns:
                    - exact: x-tenuo-warrant
                    - exact: x-tenuo-pop
                    - exact: x-tenuo-approvals
                    - exact: content-type
                  http_service:
                    server_uri:
                      uri: http://tenuo-authorizer:9090
                      cluster: tenuo-authorizer
                      timeout: 1s
                    # Check request path = /ext_authz + original path. Matches the
                    # route patterns in gateway.yaml.
                    path_prefix: /ext_authz
                    authorization_response:
                      # Authorizer response headers returned to the client on deny.
                      allowed_client_headers:
                        patterns:
                        - exact: x-tenuo-deny-reason
                        - exact: content-type
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: tenuo-authorizer
        connect_timeout: 0.5s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: tenuo-authorizer
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: tenuo-authorizer
                    port_value: 9090
      - name: httpbin
        connect_timeout: 0.5s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: httpbin
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: httpbin
                    port_value: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: tenuo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.39.1
        command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/envoy
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: envoy-config

---
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: tenuo-system
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: envoy

---
# httpbin backend
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: tenuo-system
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: httpbin

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: tenuo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      containers:
      - name: httpbin
        image: mccutchen/go-httpbin:2.25.0
        ports:
        - containerPort: 8080
