---
layout: blog-index
---

<style>
  .blog-index-content {
    padding-top: 54px;
  }

  .post-shell {
    max-width: 780px;
    margin: 0 auto;
  }

  .post-content {
    display: flex;
    flex-direction: column;
    color: var(--text);
    font-size: 1rem;
    line-height: 1.75;
  }

  .post-content > h1:first-of-type {
    order: -2;
    margin: 0 0 16px;
    color: var(--text-bright);
    font-size: clamp(2.2rem, 6vw, 3.5rem);
    line-height: 1.08;
    letter-spacing: -0.045em;
  }

  .post-meta {
    order: -1;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 40px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .post-meta time {
    white-space: nowrap;
  }

  .post-content h2 {
    margin: 52px 0 16px;
    color: var(--text-bright);
    font-size: 1.65rem;
    line-height: 1.3;
    letter-spacing: -0.025em;
  }

  .post-content h3 {
    margin: 36px 0 12px;
    color: var(--text-bright);
    font-size: 1.25rem;
    line-height: 1.4;
  }

  .post-content h4 {
    margin: 28px 0 10px;
    color: var(--text-bright);
    font-size: 1.05rem;
  }

  .post-content p {
    margin: 0 0 20px;
  }

  .post-content > p:first-of-type {
    color: var(--muted);
    font-size: 1.08rem;
  }

  .post-content a {
    color: var(--accent);
    text-underline-offset: 3px;
  }

  .post-content a:hover {
    color: var(--text-bright);
  }

  .post-content ul,
  .post-content ol {
    margin: 0 0 22px;
    padding-left: 26px;
  }

  .post-content li {
    margin-bottom: 8px;
  }

  .post-content blockquote {
    margin: 26px 0;
    padding: 18px 22px;
    color: var(--text);
    background: var(--surface);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
  }

  .post-content blockquote p:last-child {
    margin-bottom: 0;
  }

  .post-content code {
    padding: 0.16em 0.38em;
    color: var(--text-bright);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88em;
  }

  .post-content pre,
  .post-content .highlight {
    margin: 24px 0;
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .post-content pre {
    padding: 20px;
  }

  .post-content .highlight pre {
    margin: 0;
    border: 0;
    border-radius: 0;
  }

  .post-content pre code {
    padding: 0;
    background: transparent;
    border: 0;
    font-size: 0.83rem;
    line-height: 1.65;
  }

  .post-content img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 30px auto;
    border-radius: 10px;
  }

  .post-content table {
    display: block;
    width: 100%;
    margin: 26px 0;
    overflow-x: auto;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  .post-content th,
  .post-content td {
    min-width: 150px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
  }

  .post-content th {
    color: var(--text-bright);
    background: var(--surface-2);
  }

  .post-content hr {
    margin: 40px 0;
    border: 0;
    border-top: 1px solid var(--border);
  }

  .post-content details {
    margin: 22px 0;
    padding: 18px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .post-content summary {
    color: var(--text-bright);
    cursor: pointer;
    font-weight: 600;
  }

  .post-newsletter {
    margin-top: 64px;
  }

  .post-newsletter .newsletter-signup {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin-bottom: 0;
    padding: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .post-newsletter .newsletter-label {
    margin: 0 0 8px;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .post-newsletter .newsletter-copy h2 {
    margin: 0 0 8px;
    color: var(--text-bright);
    font-size: 1.2rem;
    line-height: 1.35;
    letter-spacing: -0.02em;
  }

  .post-newsletter .newsletter-copy > p:last-child {
    margin: 0;
    color: var(--muted);
    font-size: 0.88rem;
  }

  .post-newsletter .newsletter-form {
    display: flex;
    gap: 8px;
  }

  .post-newsletter .newsletter-form input {
    min-width: 0;
    flex: 1;
    padding: 11px 12px;
    color: var(--text-bright);
    background: var(--bg);
    border: 1px solid rgba(122, 154, 170, 0.35);
    border-radius: 7px;
    font: inherit;
    font-size: 0.82rem;
  }

  .post-newsletter .newsletter-form button {
    padding: 11px 16px;
    color: var(--text-bright);
    background: var(--surface-2);
    border: 1px solid rgba(122, 154, 170, 0.45);
    border-radius: 7px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .post-newsletter .newsletter-form button:hover {
    border-color: var(--accent);
  }

  .post-newsletter .newsletter-note {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 0.74rem;
  }

  .post-newsletter .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .post-back {
    display: inline-flex;
    margin-bottom: 32px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    text-decoration: none;
  }

  .post-back:hover {
    color: var(--text-bright);
  }

  @media (max-width: 720px) {
    .blog-index-content {
      padding-top: 38px;
    }

    .post-content > h1:first-of-type {
      font-size: clamp(2rem, 10vw, 2.75rem);
    }

    .post-content h2 {
      margin-top: 42px;
      font-size: 1.45rem;
    }

    .post-content pre {
      padding: 16px;
    }

    .post-newsletter .newsletter-form {
      flex-direction: column;
    }

    .post-newsletter .newsletter-form button {
      width: 100%;
    }
  }
</style>

<article class="post-shell">
  <a class="post-back" href="{{ site.baseurl }}/blog/">← Engineering Blog</a>
  <div class="post-content">
    <div class="post-meta">
      <span>{{ page.author | default: "Tenuo Engineering" }}</span>
      {% if page.date %}<span aria-hidden="true">·</span><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% endif %}
    </div>
    {{ content }}
  </div>

  <div class="post-newsletter">
    {% include newsletter-signup.html location="post" %}
  </div>
</article>
