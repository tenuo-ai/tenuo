apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tenuo-github-actions.exchangeName" . }}
  labels:
    {{- include "tenuo-github-actions.labels" . | nindent 4 }}
    app.kubernetes.io/component: exchange
spec:
  replicas: {{ .Values.exchange.replicaCount }}
  selector:
    matchLabels:
      {{- include "tenuo-github-actions.exchangeSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/exchange-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tenuo-github-actions.labels" . | nindent 8 }}
        app.kubernetes.io/component: exchange
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tenuo-github-actions.exchangeServiceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: exchange
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "tenuo-github-actions.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/tenuo/gateway.yaml
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.exchange.service.port | quote }}
          env:
            - name: TENUO_ROLE
              value: exchange
          ports:
            - name: http
              containerPort: {{ .Values.exchange.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.exchange.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/tenuo
              readOnly: true
            - name: keys
              mountPath: {{ .Values.signing.secret.mount }}
              readOnly: true
            - name: state
              mountPath: /state
      volumes:
        - name: config
          configMap:
            name: {{ include "tenuo-github-actions.exchangeName" . }}
        - name: keys
          secret:
            secretName: {{ .Values.exchange.secrets.existingSecret }}
        - name: state
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
