apiVersion: v1
kind: Service
metadata:
  name: {{ include "tenuo-github-actions.gatewayName" . }}
  labels:
    {{- include "tenuo-github-actions.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "tenuo-github-actions.gatewaySelectorLabels" . | nindent 4 }}
