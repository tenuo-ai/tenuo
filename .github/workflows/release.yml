name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to rebuild and publish to PyPI
        required: true
        type: string

# Permissions for release workflow
permissions:
  checks: read
  contents: read
  packages: write
  id-token: write  # For trusted publishing

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publish Rust crate to crates.io
  publish-crate:
    name: Publish to crates.io
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable

      - name: Verify crate builds
        working-directory: tenuo-core
        run: cargo build --release

      - name: Run tests
        working-directory: tenuo-core
        run: cargo test --release

      - name: Publish to crates.io
        working-directory: tenuo-core
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # abi3: one wheel per OS/arch. Linux aarch64 uses the same manylinux_2_28
  # container as x86_64, on the native ubuntu-24.04-arm runner.
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install maturin
        run: |
          pip install uv
          uv pip install --system maturin

      # Linux: build inside the manylinux_2_28 container so the wheel runs on
      # any glibc >= 2.28 (Ubuntu 20.04+, Debian 11+, RHEL 8+, and the default
      # python:3.x Docker images). A native build on ubuntu-latest links glibc
      # 2.38 symbols and pip refuses the wheel on every older distro.
      - name: Build wheel (manylinux_2_28)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: tenuo-python
          command: build
          args: --release --locked --compatibility pypi
          maturin-version: v1.15.0
          manylinux: 2_28
          # Empty on ubuntu-latest, which keeps the host x86_64 image. On the
          # ARM runner this selects manylinux_2_28_aarch64 instead of a cross image.
          target: ${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || '' }}

      - name: Build wheel
        if: runner.os != 'Linux'
        working-directory: tenuo-python
        run: maturin build --release

      - name: Check wheel tag
        working-directory: tenuo-python
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          case "${{ matrix.os }}" in
            ubuntu-latest) tag="manylinux_2_28_x86_64" ;;
            ubuntu-24.04-arm) tag="manylinux_2_28_aarch64" ;;
            macos-latest) tag="macosx_*_arm64" ;;
            windows-latest) tag="win_amd64" ;;
            *) echo "no wheel tag configured for ${{ matrix.os }}"; exit 1 ;;
          esac
          wheels=(target/wheels/*${tag}*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one ${tag} wheel, found ${#wheels[@]}"
            ls -la target/wheels || true
            exit 1
          fi
          echo "wheel tag ok: ${wheels[0]}"

      - name: Smoke test wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(tenuo-python/target/wheels/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            # glibc 2.36, same check as the portability CI job. The runner's
            # own glibc is newer and would not catch a too-new symbol.
            docker run --rm \
              -e EXPECT_ARCH="${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}" \
              -v "$PWD/tenuo-python/target/wheels:/wheels:ro" \
              python:3.12-slim-bookworm bash -ec '
              set -euo pipefail
              test "$(uname -m)" = "$EXPECT_ARCH"
              # Avoid piping to `head`: with pipefail, glibc can receive
              # SIGPIPE and turn this diagnostic into exit 141.
              ldd --version
              pip install --quiet /wheels/*.whl
              python -c "import tenuo, tenuo_core; from tenuo import SigningKey, Warrant; k = SigningKey.generate(); w = Warrant.mint_builder().tool(\"ping\").holder(k.public_key).ttl(60).mint(k); print(\"tenuo\", tenuo.__version__, \"ok\", w.id[:12])"
            '
          else
            uv pip install --system "${wheels[0]}"
            python -c 'import tenuo, tenuo_core; print(tenuo.__version__, tenuo.__file__); print(tenuo_core.__file__)'
          fi

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: wheel-${{ matrix.os }}
          path: tenuo-python/target/wheels/*.whl
          if-no-files-found: error

  # Build source distribution
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install maturin
        run: |
          pip install uv
          uv pip install --system maturin

      - name: Build sdist
        working-directory: tenuo-python
        run: maturin sdist

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sdist
          path: tenuo-python/target/wheels/*.tar.gz
          if-no-files-found: error

  # Publish to PyPI
  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-ubuntu-latest
          path: dist/

      - name: Download Linux aarch64 wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-ubuntu-24.04-arm
          path: dist/

      - name: Download macOS wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-macos-latest
          path: dist/

      - name: Download Windows wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-windows-latest
          path: dist/

      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist/

      - name: Require expected artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          ls -la
          require() {
            local label="$1"
            local pattern="$2"
            local -a matches=()
            while IFS= read -r -d '' file; do
              matches+=("$file")
            done < <(find . -maxdepth 1 -type f -name "$pattern" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "expected exactly one ${label} (${pattern}), found ${#matches[@]}"
              exit 1
            fi
            echo "ok ${label}: ${matches[0]}"
          }
          require "linux x86_64 wheel" "*manylinux_2_28_x86_64*.whl"
          require "linux aarch64 wheel" "*manylinux_2_28_aarch64*.whl"
          require "macos arm64 wheel" "*macosx_*_arm64.whl"
          require "windows wheel" "*win_amd64.whl"
          require "sdist" "*.tar.gz"
          wheels=( *.whl )
          sdists=( *.tar.gz )
          if [ "${#wheels[@]}" -ne 4 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "expected 4 wheels and 1 sdist, found ${#wheels[@]} wheels and ${#sdists[@]} sdists"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
          skip-existing: true

  # Publish both TypeScript packages on the channel derived from their version.
  publish-npm:
    name: Publish TypeScript packages to npm
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: tenuo-ts/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Install
        working-directory: tenuo-ts
        run: pnpm install --frozen-lockfile

      - name: Validate npm release policy
        id: npm-policy
        working-directory: tenuo-ts
        shell: bash
        run: |
          set -euo pipefail
          read -r version dist_tag < <(node scripts/npm-release-policy.mjs check-workspace "${GITHUB_REF_NAME}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing @tenuo packages at $version on npm dist-tag $dist_tag"

      - name: Require stable-release checks for the tagged commit
        if: steps.npm-policy.outputs.dist_tag == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          check_runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=latest&per_page=100")
          required_checks=(
            "TypeScript SDK"
            "TypeScript SDK (Node 22)"
            "TypeScript SDK (Node 24)"
            "TypeScript SDK (Windows pack smoke)"
            "TypeScript Red Team Tests"
            "TypeScript Differential Security"
            "TypeScript Mutation Security"
          )
          for check_name in "${required_checks[@]}"; do
            if ! jq -e --arg name "$check_name" \
              '.check_runs | any(.name == $name and .conclusion == "success")' \
              <<< "$check_runs" >/dev/null; then
              echo "Required successful check missing for ${GITHUB_SHA}: $check_name" >&2
              exit 1
            fi
          done

      - name: Build WASM
        working-directory: tenuo-ts
        run: pnpm build:wasm

      - name: Typecheck
        working-directory: tenuo-ts
        run: pnpm typecheck

      - name: Test
        working-directory: tenuo-ts
        run: pnpm test

      - name: Pack smoke
        working-directory: tenuo-ts
        run: pnpm --filter @tenuo/core build && pnpm --filter @tenuo/core pack:smoke && pnpm --filter @tenuo/mcp build && pnpm --filter @tenuo/mcp pack:smoke

      - name: Publish @tenuo/core
        working-directory: tenuo-ts/packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.npm-policy.outputs.version }}
          DIST_TAG: ${{ steps.npm-policy.outputs.dist_tag }}
        run: |
          set -euo pipefail
          if npm view "@tenuo/core@${VERSION}" version >/dev/null 2>&1; then
            echo "@tenuo/core@${VERSION} already exists; skipping publish"
          else
            npm publish --access public --provenance --tag "$DIST_TAG"
          fi
          npm dist-tag add "@tenuo/core@${VERSION}" "$DIST_TAG"

      - name: Wait for @tenuo/core registry visibility
        env:
          VERSION: ${{ steps.npm-policy.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if npm view "@tenuo/core@${VERSION}" version >/dev/null 2>&1; then
              exit 0
            fi
            echo "Waiting for @tenuo/core@${VERSION} to become visible (attempt ${attempt}/12)"
            sleep 5
          done
          echo "@tenuo/core@${VERSION} did not become visible" >&2
          exit 1

      - name: Publish @tenuo/mcp
        working-directory: tenuo-ts/packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.npm-policy.outputs.version }}
          DIST_TAG: ${{ steps.npm-policy.outputs.dist_tag }}
        run: |
          set -euo pipefail
          if npm view "@tenuo/mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "@tenuo/mcp@${VERSION} already exists; skipping publish"
          else
            npm publish --access public --provenance --tag "$DIST_TAG"
          fi
          npm dist-tag add "@tenuo/mcp@${VERSION}" "$DIST_TAG"

      - name: Verify npm dist-tags
        env:
          VERSION: ${{ steps.npm-policy.outputs.version }}
          DIST_TAG: ${{ steps.npm-policy.outputs.dist_tag }}
        run: |
          set -euo pipefail
          for package in @tenuo/core @tenuo/mcp; do
            actual=""
            query_succeeded=false
            for attempt in {1..12}; do
              if actual=$(npm view "${package}@${VERSION}" "dist-tags.${DIST_TAG}" 2>/dev/null); then
                query_succeeded=true
                if [ "$actual" = "$VERSION" ]; then
                  break
                fi
                echo "Waiting for $package dist-tag $DIST_TAG (attempt ${attempt}/12)"
              else
                echo "Registry query for $package dist-tag $DIST_TAG failed (attempt ${attempt}/12)" >&2
              fi
              sleep 5
            done
            if [ "$query_succeeded" != true ] || [ "$actual" != "$VERSION" ]; then
              echo "$package dist-tag $DIST_TAG resolved to '$actual', expected '$VERSION'" >&2
              exit 1
            fi
            if [[ "$VERSION" == *-* ]]; then
              latest=""
              latest_query_succeeded=false
              for attempt in {1..12}; do
                if latest=$(npm view "${package}@${VERSION}" "dist-tags.latest" 2>/dev/null); then
                  latest_query_succeeded=true
                  break
                fi
                echo "Registry query for $package dist-tag latest failed (attempt ${attempt}/12)" >&2
                sleep 5
              done
              if [ "$latest_query_succeeded" != true ]; then
                echo "Could not verify $package dist-tag latest" >&2
                exit 1
              fi
              if [ -n "$latest" ] && \
                ! node tenuo-ts/scripts/npm-release-policy.mjs assert "$latest" latest; then
                echo "$package dist-tag latest must be absent or resolve to a stable version, found '$latest'" >&2
                exit 1
              fi
            fi
          done

  # Docker: native amd64 + arm64 per platform (no QEMU), then merge manifests.
  docker-authorizer-build:
    name: Docker Authorizer (${{ matrix.platform }})
    if: github.event_name == 'release'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            digest-suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            digest-suffix: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: tenuo/authorizer

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./tenuo-core
          file: ./tenuo-core/deploy/docker/Dockerfile.authorizer
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-authorizer-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=release-authorizer-${{ matrix.platform }}
          outputs: type=image,name=tenuo/authorizer,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: digests-release-authorizer-${{ matrix.digest-suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-authorizer-merge:
    name: Docker Authorizer (manifest)
    runs-on: ubuntu-latest
    needs: [docker-authorizer-build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-release-authorizer-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: tenuo/authorizer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'tenuo/authorizer@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect tenuo/authorizer:${{ steps.meta.outputs.version }}

  docker-control-build:
    name: Docker Control (${{ matrix.platform }})
    if: github.event_name == 'release'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            digest-suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            digest-suffix: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: tenuo/control

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./tenuo-core
          file: ./tenuo-core/deploy/docker/Dockerfile.control
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-control-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=release-control-${{ matrix.platform }}
          outputs: type=image,name=tenuo/control,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: digests-release-control-${{ matrix.digest-suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-control-merge:
    name: Docker Control (manifest)
    runs-on: ubuntu-latest
    needs: [docker-control-build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-release-control-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: tenuo/control
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'tenuo/control@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect tenuo/control:${{ steps.meta.outputs.version }}
