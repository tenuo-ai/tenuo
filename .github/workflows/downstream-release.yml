name: Notify downstream integrations

on:
  workflow_run:
    workflows: [Release, Authorizer Binaries]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to replay; empty selects the latest release
        type: string

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: >-
      vars.TENUO_DOWNSTREAM_AUTOMATION_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run has privileged credentials: execute only trusted default-
      # branch code, never the triggering run's checkout or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate the published release and source commit
        id: release
        run: python scripts/dispatch_downstream_release.py prepare --tag "$RELEASE_TAG" --controller "$CONTROLLER"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
          CONTROLLER: ${{ github.repository_owner }}/${{ vars.TENUO_DOWNSTREAM_CONTROLLER }}
      - name: Create a token limited to the controller repository
        if: steps.release.outputs.eligible == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ vars.TENUO_OPS_APP_ID }}
          private-key: ${{ secrets.TENUO_OPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.TENUO_DOWNSTREAM_CONTROLLER }}
          permission-contents: write
      - name: Notify the downstream controller
        if: steps.release.outputs.eligible == 'true'
        run: >-
          python scripts/dispatch_downstream_release.py dispatch
          --controller "$CONTROLLER" --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CONTROLLER: ${{ github.repository_owner }}/${{ vars.TENUO_DOWNSTREAM_CONTROLLER }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
