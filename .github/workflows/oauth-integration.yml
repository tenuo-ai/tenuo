name: OAuth Integration

on:
  pull_request:
    paths:
      - 'tenuo-python/tenuo/oauth.py'
      - 'tenuo-python/tenuo/_issuance.py'
      - 'tenuo-python/tenuo/_issuance_http.py'
      - 'tenuo-python/tenuo/spiffe.py'
      - 'tenuo-python/tenuo/mcp/**'
      - 'tenuo-python/examples/oauth/**'
      - 'tenuo-python/tests/adapters/test_oauth.py'
      - 'tenuo-python/tests/e2e/test_oauth_keycloak.py'
      - 'tenuo-python/tests/e2e/test_oauth_oidc_provider.py'
      - 'tenuo-python/tests/e2e/test_oauth_github_actions.py'
      - 'tenuo-python/tests/e2e/test_oauth_gateway.py'
      - 'tenuo-python/tests/e2e/test_oauth_entra.py'
      - 'tenuo-python/pyproject.toml'
      - 'tenuo-core/**'
      - '.github/workflows/oauth-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interoperability:
    name: OAuth ${{ matrix.provider }} to enforced refunds and email
    strategy:
      fail-fast: false
      matrix:
        provider: [keycloak, oidc-provider]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build this checkout and install test dependencies
        run: python -m pip install './tenuo-python[oauth,fastmcp]' pytest pytest-asyncio uvicorn httpx playwright aiosmtpd
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.provider == 'oidc-provider'
        with:
          node-version: '22'
      - name: Install pinned independent OAuth provider
        if: matrix.provider == 'oidc-provider'
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tenuo-python/examples/oauth/oidc-provider-fixture
      - name: Install real browser
        run: python -m playwright install --with-deps chromium
      - name: Adapter security and real OAuth end-to-end tests
        env:
          PYTHONPATH: tenuo-python
          TENUO_KEYCLOAK_SMOKE: ${{ matrix.provider == 'keycloak' && '1' || '0' }}
          TENUO_OIDC_SMOKE: ${{ matrix.provider == 'oidc-provider' && '1' || '0' }}
        run: python -m pytest tenuo-python/tests/adapters/test_oauth.py tenuo-python/tests/e2e/test_oauth_keycloak.py tenuo-python/tests/e2e/test_oauth_oidc_provider.py -q --override-ini='addopts='

  gateway:
    name: OAuth gateway (Envoy and Keycloak) with warrant checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build this checkout and install test dependencies
        run: python -m pip install './tenuo-python[oauth]' pytest uvicorn
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build authorizer from this checkout
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tenuo-core
          file: tenuo-core/deploy/docker/Dockerfile.authorizer
          tags: tenuo-authorizer:oauth-e2e
          load: true
          push: false
          cache-from: type=gha,scope=oauth-authorizer-e2e
          cache-to: type=gha,mode=max,scope=oauth-authorizer-e2e
      - name: Keycloak token through Envoy to the Tenuo authorizer
        env:
          PYTHONPATH: tenuo-python
          TENUO_OAUTH_GATEWAY_SMOKE: '1'
          TENUO_AUTHORIZER_IMAGE: tenuo-authorizer:oauth-e2e
        run: python -m pytest tenuo-python/tests/e2e/test_oauth_gateway.py -q -s --override-ini='addopts='

  github-actions-token:
    name: OAuth GitHub Actions workflow token to warrant
    # A pull request from a fork gets no workflow token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # The test asks GitHub for this run's OIDC token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build this checkout and install test dependencies
        run: python -m pip install './tenuo-python[oauth]' pytest uvicorn
      - name: Exchange this run's token for a warrant
        env:
          PYTHONPATH: tenuo-python
          TENUO_REQUIRE_GITHUB_OIDC: '1'
        run: python -m pytest tenuo-python/tests/e2e/test_oauth_github_actions.py -q --override-ini='addopts='

  entra-id:
    name: OAuth Microsoft Entra ID token to warrant
    # Needs an Entra tenant that trusts this repository's workflow runs; the three
    # identifiers are repository variables, not secrets. A pull request from a fork
    # gets no workflow token, and a repository without the variables skips the job.
    if: >-
      vars.TENUO_ENTRA_TENANT_ID != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # Presented to Entra as the client assertion. No secret is stored.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build this checkout and install test dependencies
        run: python -m pip install './tenuo-python[oauth]' pytest uvicorn
      - name: Exchange an Entra access token for a warrant
        env:
          PYTHONPATH: tenuo-python
          TENUO_REQUIRE_ENTRA: '1'
          TENUO_ENTRA_TENANT_ID: ${{ vars.TENUO_ENTRA_TENANT_ID }}
          TENUO_ENTRA_API_CLIENT_ID: ${{ vars.TENUO_ENTRA_API_CLIENT_ID }}
          TENUO_ENTRA_CLIENT_ID: ${{ vars.TENUO_ENTRA_CLIENT_ID }}
        run: python -m pytest tenuo-python/tests/e2e/test_oauth_entra.py -q -s --override-ini='addopts='
