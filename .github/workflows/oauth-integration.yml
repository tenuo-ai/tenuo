name: OAuth Integration

on:
  pull_request:
    paths:
      - 'tenuo-python/tenuo/oauth.py'
      - 'tenuo-python/tenuo/_spiffe_http.py'
      - 'tenuo-python/tenuo/spiffe.py'
      - 'tenuo-python/tenuo/mcp/**'
      - 'tenuo-python/examples/oauth/**'
      - 'tenuo-python/tests/adapters/test_oauth.py'
      - 'tenuo-python/tests/e2e/test_oauth_keycloak.py'
      - 'tenuo-python/pyproject.toml'
      - 'tenuo-core/**'
      - '.github/workflows/oauth-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keycloak:
    name: Keycloak PKCE and task-scoped MCP refunds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build this checkout and install test dependencies
        run: python -m pip install './tenuo-python[oauth,fastmcp]' pytest pytest-asyncio uvicorn playwright
      - name: Install real browser
        run: python -m playwright install --with-deps chromium
      - name: Adapter security and real OAuth end-to-end tests
        env:
          PYTHONPATH: tenuo-python
          TENUO_KEYCLOAK_SMOKE: '1'
        run: python -m pytest tenuo-python/tests/adapters/test_oauth.py tenuo-python/tests/e2e/test_oauth_keycloak.py -q --override-ini='addopts='
