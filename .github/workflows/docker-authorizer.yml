name: Authorizer Docker

on:
  # Manual trigger with version input
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., 0.1.0-beta.7+authz.2)'
        required: false
        default: ''
  # Auto-trigger on authorizer changes to main
  push:
    branches: [main]
    paths:
      - 'tenuo-core/src/bin/authorizer.rs'
      - 'tenuo-core/src/approval_gate.rs'
      - 'tenuo-core/src/planes.rs'
      - 'tenuo-core/src/warrant.rs'
      - 'tenuo-core/src/heartbeat.rs'
      - 'tenuo-core/deploy/docker/Dockerfile.authorizer'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: tenuo/authorizer

jobs:
  # ──────────────────────────────────────────────────────────
  # Build each platform natively (no QEMU emulation)
  # ──────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from authorizer.rs
        id: version
        run: |
          BUILD=$(grep -oP 'AUTHORIZER_BUILD:\s*u32\s*=\s*\K\d+' tenuo-core/src/bin/authorizer.rs || echo "1")
          CRATE_VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' tenuo-core/Cargo.toml)

          # Docker tags reject '+'. Keep the build suffix hyphenated
          # ("0.3.2-authz-3"), not dotted ("0.3.2-authz.3"): a dotted suffix
          # has more dots than the crate tag and wins the Hub version badge.
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            DOCKER_VERSION="${{ github.event.inputs.version_tag }}"
            DOCKER_VERSION="${DOCKER_VERSION/+authz./-authz-}"
            DOCKER_VERSION="${DOCKER_VERSION//+/-}"
          else
            DOCKER_VERSION="${CRATE_VERSION}-authz-${BUILD}"
          fi
          echo "version=${DOCKER_VERSION}" >> $GITHUB_OUTPUT
          echo "crate_version=${CRATE_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./tenuo-core
          file: ./tenuo-core/deploy/docker/Dockerfile.authorizer
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=authorizer-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=authorizer-${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ──────────────────────────────────────────────────────────
  # Merge digests into a single multi-arch manifest
  # ──────────────────────────────────────────────────────────
  merge:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: build
    # Manual runs write a version tag, so they share release.yml's queue:
    # one publish at a time, and no two runs both pass the tag check. Main
    # pushes write only main and sha- tags; they get their own FIFO queue so
    # an older run can never finish after a newer one and move main backwards.
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && 'docker-publish-tenuo-authorizer' || 'docker-authorizer-main' }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The freshness check walks the commits after this one.
          fetch-depth: 0

      - name: Extract version from authorizer.rs
        id: version
        run: |
          BUILD=$(grep -oP 'AUTHORIZER_BUILD:\s*u32\s*=\s*\K\d+' tenuo-core/src/bin/authorizer.rs || echo "1")
          CRATE_VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' tenuo-core/Cargo.toml)

          # Docker tags reject '+'. Keep the build suffix hyphenated
          # ("0.3.2-authz-3"), not dotted ("0.3.2-authz.3"): a dotted suffix
          # has more dots than the crate tag and wins the Hub version badge.
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            DOCKER_VERSION="${{ github.event.inputs.version_tag }}"
            DOCKER_VERSION="${DOCKER_VERSION/+authz./-authz-}"
            DOCKER_VERSION="${DOCKER_VERSION//+/-}"
          else
            DOCKER_VERSION="${CRATE_VERSION}-authz-${BUILD}"
          fi
          echo "version=${DOCKER_VERSION}" >> $GITHUB_OUTPUT
          echo "crate_version=${CRATE_VERSION}" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Version tags belong to deliberate builds and are never rewritten.
            # A push to main gets only tags that are meant to move ("main") or
            # are unique to the commit. Plain crate versions and "latest" are
            # written by release.yml alone.
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Refuse to overwrite a version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          ref="${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
            echo "::error::$ref already exists; bump AUTHORIZER_BUILD or pass a new version_tag"
            exit 1
          elif ! grep -qi "not found" <<< "$out"; then
            echo "::error::could not check $ref: $out"
            exit 1
          fi

      # The FIFO queue orders merge jobs by when their builds finish, not by
      # push order, so an older run can still reach this point last. Move
      # "main" only if no later commit on the branch touches the paths that
      # trigger this workflow (each such commit has its own run that will
      # move it). Commits are checked one by one, so a later revert still
      # counts. A README-only push doesn't. The sha- tag is always published.
      - name: Check main publication is current
        id: freshness
        if: github.event_name == 'push'
        env:
          # Keep in sync with on.push.paths.
          WATCHED: >-
            tenuo-core/src/bin/authorizer.rs
            tenuo-core/src/approval_gate.rs
            tenuo-core/src/planes.rs
            tenuo-core/src/warrant.rs
            tenuo-core/src/heartbeat.rs
            tenuo-core/deploy/docker/Dockerfile.authorizer
        run: |
          git fetch --quiet origin "${{ github.ref }}"
          # shellcheck disable=SC2086 # WATCHED is a space-separated path list
          newer=$(git rev-list --full-history -1 "${{ github.sha }}..FETCH_HEAD" -- $WATCHED)
          if [[ -n "$newer" ]]; then
            echo "move_main=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$newer also changes the authorizer; publishing sha- only"
          else
            echo "move_main=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create manifest list and push
        id: push
        working-directory: /tmp/digests
        env:
          DROP_MAIN: ${{ steps.freshness.outputs.move_main == 'false' }}
        run: |
          tags=$(jq -c --argjson drop "$DROP_MAIN" '.tags | map(select(($drop | not) or (endswith(":main") | not)))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "tags=$(jq -r 'join(" ")' <<< "$tags")" >> "$GITHUB_OUTPUT"
          # A tag this run just wrote: the version tag if there is one, else sha-.
          echo "ref=$(jq -r '(map(select((contains(":sha-") or endswith(":main")) | not)) + map(select(contains(":sha-"))))[0]' <<< "$tags")" >> "$GITHUB_OUTPUT"
          docker buildx imagetools create \
            $(jq -r 'map("-t " + .) | join(" ")' <<< "$tags") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.push.outputs.ref }}

      - name: Summary
        run: |
          echo "## Authorizer Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.push.outputs.tags }}" | tr ' ' '\n' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ steps.push.outputs.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
