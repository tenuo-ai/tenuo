name: Retry Helm chart

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release with a failed chart job
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retry failed chart job in the original release
        run: python3 scripts/retry_helm_chart.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
