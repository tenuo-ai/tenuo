name: Documentation checks

on:
  push:
    branches: [main]
    paths: ['docs/**', 'tenuo-core/**', '.github/workflows/**', 'scripts/check-website-boundary.sh', 'AGENTS.md', 'CNAME']
  pull_request:
    paths: ['docs/**', 'tenuo-core/**', '.github/workflows/**', 'scripts/check-website-boundary.sh', 'AGENTS.md', 'CNAME']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce website repository boundary
        run: bash scripts/check-website-boundary.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Rust API docs
        working-directory: tenuo-core
        run: cargo doc --no-deps
      - name: Upload Rust API docs
        uses: actions/upload-artifact@v7
        with:
          name: rust-api-docs
          path: tenuo-core/target/doc/
          if-no-files-found: error
