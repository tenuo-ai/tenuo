# Concierge box: gateway only. Cloud (or a separate exchange) issues warrants.
# Put app.pem and receipt.pem in ./secrets/ — never in the environment.
# From the monorepo root:
#   docker compose -f github-actions/examples/compose.yaml up --build
# Optional: TENUO_PIP_SPEC=tenuo==0.2.5  or drop a wheel in github-actions/docker/wheels/
# linux/amd64 uses the published manylinux wheel.
services:
  gateway:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: github-actions/Dockerfile
      args:
        TENUO_PIP_SPEC: ${TENUO_PIP_SPEC:-tenuo==0.2.4}
    environment:
      TENUO_ROLE: gateway
      TENUO_GATEWAY_CONFIG: /etc/tenuo/gateway.yaml
      TENUO_ROOT_PUBLIC_KEY: ${TENUO_ROOT_PUBLIC_KEY}
      TENUO_GITHUB_APP_ID: ${TENUO_GITHUB_APP_ID}
      TENUO_REPOSITORY: ${TENUO_REPOSITORY}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ./gateway-secret.yaml:/etc/tenuo/gateway.yaml:ro
      - ./secrets:/var/run/secrets/tenuo:ro
      - receipts:/state
    read_only: true
    tmpfs:
      - /tmp
volumes:
  receipts:
