version: 1
trust:
  root_public_keys: ["${TENUO_ROOT_PUBLIC_KEY}"]
  require_pop: true
signing:
  provider: memory
# ceiling.repositories is issuance identity (I8), not a gateway ACL after allow.
ceiling:
  repositories: ["acme/widgets"]
tools:
  packs: [github-triage]
receipts:
  sink: file
  path: /tmp/tenuo-receipts.jsonl
