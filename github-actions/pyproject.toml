[project]
name = "tenuo-github-actions"
version = "0.1.0"
description = "Tenuo for GitHub Actions"
requires-python = ">=3.10"
dependencies = [
    "tenuo",
    "pyyaml>=6.0",
    "fastmcp>=3.2.1",
    "PyJWT>=2.8",
    "cryptography>=42",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
tenuo-gha = "tenuo_gha.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tenuo_gha*"]
